AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'spec/**/*'
    - 'examples/**/*'
    - 'docs/**/*'
    - 'benchmark/**/*'
    # ruby/setup-ruby installs dependencies here when Bundler caching is enabled.
    - 'vendor/bundle/**/*'
    - 'Gemfile'
    - 'Rakefile'
    - '*.gemspec'

Layout/EndOfLine:
  Enabled: false

Layout/LineLength:
  Enabled: false

Metrics:
  Enabled: false

# The contract DSL deliberately uses Struct-based immutable value objects and
# Ruby callback hooks. These cops flag false positives for those patterns.
Lint/MissingSuper:
  Enabled: false

Lint/DuplicateBranch:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

Style/Documentation:
  Enabled: false

# Anonymous argument forwarding is unavailable on the gem's Ruby 3.1 floor.
Style/ArgumentsForwarding:
  Enabled: false

Style/FrozenStringLiteralComment:
  Exclude:
    - 'Gemfile'
    - 'Rakefile'
    - '*.gemspec'

Style/StringLiterals:
  EnforcedStyle: double_quotes

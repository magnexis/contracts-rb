name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Version to publish, such as 0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out pushed tag
        if: github.event_name == 'push'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out selected tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          ref: v${{ inputs.confirm_version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            VERSION="${{ inputs.confirm_version }}"
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          ruby -e 'spec = Gem::Specification.load("contracts-rb.gemspec"); abort "tag/version mismatch" unless "v#{spec.version}" == ENV.fetch("RELEASE_TAG")'
          grep -F "## ${RELEASE_VERSION} -" CHANGELOG.md
      - name: Test and lint
        run: |
          bundle exec rspec
          bundle exec rubocop .
      - name: Build exact gem
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p pkg
          gem build contracts-rb.gemspec --output "pkg/contracts-rb-${RELEASE_VERSION}.gem"
          gem install "pkg/contracts-rb-${RELEASE_VERSION}.gem" --install-dir tmp/gem-home --no-document
          GEM_HOME="$PWD/tmp/gem-home" GEM_PATH="$PWD/tmp/gem-home" ruby -e 'require "contracts"; require "contracts/structured"; puts Contracts::VERSION'
      - name: Publish to RubyGems with trusted publishing
        uses: rubygems/release-gem@v1
      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" pkg/*.gem --clobber
          else
            gh release create "$RELEASE_TAG" pkg/*.gem --verify-tag --generate-notes --title "Contracts-rb ${RELEASE_TAG#v}"
          fi

name: Release

on:
  push:
    tags: ["v*"]
    branches: [master]
    paths:
      - ".release-trigger/0.2.0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v0.2.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Verify version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          ruby -e 'spec = Gem::Specification.load("contracts-rb.gemspec"); abort "tag/version mismatch" unless "v#{spec.version}" == ENV.fetch("RELEASE_TAG")'
          grep -F "## ${RELEASE_VERSION} -" CHANGELOG.md
      - name: Test and lint
        run: |
          bundle exec rspec
          bundle exec rubocop .
      - name: Build exact gem
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p pkg
          gem build contracts-rb.gemspec --output "pkg/contracts-rb-${RELEASE_VERSION}.gem"
          gem install "pkg/contracts-rb-${RELEASE_VERSION}.gem" --install-dir tmp/gem-home --no-document
          GEM_HOME="$PWD/tmp/gem-home" GEM_PATH="$PWD/tmp/gem-home" ruby -e 'require "contracts"; require "contracts/structured"; puts Contracts::VERSION'
      - name: Finalize semantic tag
        if: github.ref_type != 'tag'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .release-trigger/0.2.0
          git add -A
          git commit -m "Prepare Contracts-rb 0.2.0 release"
          git push origin HEAD:master
          if ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git tag -a "$RELEASE_TAG" -m "Contracts-rb 0.2.0"
            git push origin "$RELEASE_TAG"
          fi
      - name: Publish to RubyGems with trusted publishing
        uses: rubygems/release-gem@v1
      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" pkg/*.gem --clobber
          else
            gh release create "$RELEASE_TAG" pkg/*.gem --verify-tag --generate-notes --title "Contracts-rb ${RELEASE_TAG#v}"
          fi
